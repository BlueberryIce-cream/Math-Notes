<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX Study Notes</title>
  
  <!-- KaTeX CDN for rendering LaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});">
  </script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; color: #222; line-height: 1.7; }
    header { border-bottom: 2px solid #f0f0f0; margin-bottom: 30px; padding-bottom: 10px; }
    .note-card { background: #f9f9fb; border-left: 4px solid #2563eb; padding: 20px; margin-bottom: 25px; border-radius: 0 8px 8px 0; }
    h1 { font-size: 2rem; margin: 0; }
    h2 { font-size: 1.3rem; margin-top: 0; color: #1e40af; }
    code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>

  <header>
    <h1>Personal Notes</h1>
  </header>

  <main>
    <div class="note-card">
      <h2>Calculus: Euler's Identity</h2>
      <p>Inline math renders seamlessly using single dollar signs like $e^{i\pi} + 1 = 0$ inside sentences.</p>
      <p>For standalone, centered display equations, use double dollar signs:</p>
      $$\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}$$
    </div>
  </main>

</body>
</html>
